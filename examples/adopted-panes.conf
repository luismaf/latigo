# Panes that belong to this project even though their cwd is somewhere else.
# One pane id per line.
#
# A worker started from your home directory is not idle by choice, it is
# invisible: it never matches the cwd filter, so it is never considered and
# never reported. Adopt it here instead of restarting it — restarting throws
# away its session.
#
# Adopted panes get an absolute `cd` prefixed to every request; without it,
# every relative path in the request resolves against the wrong directory and
# fails silently.
#
# Keep these lists DISJOINT between projects. A pane listed in two projects
# receives two items and loses one.
w1:pB
